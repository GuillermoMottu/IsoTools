name: Deploy ORCA tools to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tool:
        description: Tool to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - compare_planned_vs_actual
          - track_project_progress
      mode:
        description: Inspect, deploy, publish marked QA or replay existing inputs read-only
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - deploy
          - validate
          - replay
          - isolate
      confirm_pause:
        description: Permit a bounded CPA/TPP pause with automatic restoration for Logto isolation
        type: boolean
        default: false
      activate_consumer:
        description: Activate registered consumers for new events (no historical replay)
        type: boolean
        default: false

concurrency:
  group: deploy-orca-tools-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy_compare:
    name: deploy compare_planned_vs_actual
    runs-on: ubuntu-latest

    if: ${{ github.event_name != 'workflow_dispatch' || ((inputs.mode == 'inspect' || inputs.mode == 'deploy') && (inputs.tool == 'all' || inputs.tool == 'compare_planned_vs_actual')) }}

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_COMPARE_TOKEN || secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.COMPARE_PLANNED_VS_ACTUAL_RAILWAY_SERVICE || 'compare-planned-vs-actual' }}
      RAILWAY_DOCKERFILE_PATH: Docker/compare_planned_vs_actual.Dockerfile
      TOOL_PAGE_ID: compare_planned_vs_actual
      RAILWAY_CONFIG_FILE: Docker/compare_planned_vs_actual.railway.toml
      DEPLOY_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy' }}
      HEALTH_URL: ${{ vars.COMPARE_PLANNED_VS_ACTUAL_HEALTH_URL || '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Verify Railway token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Missing GitHub secret RAILWAY_TOKEN."
            exit 1
          fi

      - name: Verify ORCA deployment config
        run: |
          if [ ! -f "$RAILWAY_DOCKERFILE_PATH" ]; then
            echo "::error::Missing Dockerfile: $RAILWAY_DOCKERFILE_PATH"
            exit 1
          fi
          echo "Service: $RAILWAY_SERVICE"
          echo "Dockerfile: $RAILWAY_DOCKERFILE_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test SSO and runtime checks before changing Railway
        if: ${{ env.DEPLOY_REQUESTED == 'true' }}
        run: |
          corepack enable
          pnpm install --prod --frozen-lockfile
          node scripts/test_sso_configuration.js
          node scripts/test_auth_protection.js
          node scripts/test_data_quality.js
          node scripts/test_railway_inspection.js
          node scripts/test_railway_preparation.js
          node scripts/test_runbook_deployed_auth.js
          node scripts/test_runbook_consumer.js
          node scripts/test_tools_development.js
          node scripts/test_project_context_lookup.js
          node scripts/test_runbook_runtime.js
          node scripts/test_tool_service.js
          node scripts/test_sso_handshake.js

      - name: Test deployment source inspection
        run: |
          node scripts/test_deployment_source.js
          node scripts/test_consumer_backlog.js

      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.67.1

      - name: Prepare tool runtime and persistent storage
        if: ${{ env.DEPLOY_REQUESTED == 'true' }}
        env:
          ISOTOOLS_API_KEY: ${{ secrets.ISOTOOLS_API_KEY }}
          SESSION_SECRET: ${{ secrets.COMPARE_SESSION_SECRET }}
          TOOL_API_KEY: ${{ secrets.COMPARE_TOOL_API_KEY }}
          ACTIVATE_CONSUMER: ${{ inputs.activate_consumer == true }}
        run: node scripts/prepare_railway_tool.js

      - name: Verify remote configuration and central API key
        if: ${{ env.DEPLOY_REQUESTED == 'true' }}
        run: node scripts/inspect_railway_tool.js --require-deploy-config

      - name: Inspect existing service without exposing secrets
        if: ${{ env.DEPLOY_REQUESTED != 'true' }}
        run: node scripts/inspect_railway_tool.js

      - name: Select tool configuration for this upload
        if: ${{ env.DEPLOY_REQUESTED == 'true' }}
        run: cp "$RAILWAY_CONFIG_FILE" railway.toml

      - name: Deploy
        if: ${{ env.DEPLOY_REQUESTED == 'true' }}
        run: railway up --service "$RAILWAY_SERVICE" --ci

      - name: Smoke health
        if: ${{ env.DEPLOY_REQUESTED == 'true' }}
        run: node scripts/wait_tool_deployment.js

      - name: Verify deployed identity, required SSO and secret-free assets
        if: ${{ env.DEPLOY_REQUESTED == 'true' }}
        run: node scripts/inspect_railway_tool.js --require-deployed-tool

  deploy_track:
    name: deploy track_project_progress
    runs-on: ubuntu-latest

    if: ${{ github.event_name != 'workflow_dispatch' || ((inputs.mode == 'inspect' || inputs.mode == 'deploy') && (inputs.tool == 'all' || inputs.tool == 'track_project_progress')) }}

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TRACK_TOKEN || secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.TRACK_PROJECT_PROGRESS_RAILWAY_SERVICE || 'track-project-progress' }}
      RAILWAY_DOCKERFILE_PATH: Docker/track_project_progress.Dockerfile
      TOOL_PAGE_ID: track_project_progress
      RAILWAY_CONFIG_FILE: Docker/track_project_progress.railway.toml
      DEPLOY_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy' }}
      HEALTH_URL: ${{ vars.TRACK_PROJECT_PROGRESS_HEALTH_URL || '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Verify Railway token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Missing GitHub secret RAILWAY_TOKEN."
            exit 1
          fi

      - name: Verify ORCA deployment config
        run: |
          if [ ! -f "$RAILWAY_DOCKERFILE_PATH" ]; then
            echo "::error::Missing Dockerfile: $RAILWAY_DOCKERFILE_PATH"
            exit 1
          fi
          echo "Service: $RAILWAY_SERVICE"
          echo "Dockerfile: $RAILWAY_DOCKERFILE_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test SSO and runtime checks before changing Railway
        if: ${{ env.DEPLOY_REQUESTED == 'true' }}
        run: |
          corepack enable
          pnpm install --prod --frozen-lockfile
          node scripts/test_sso_configuration.js
          node scripts/test_auth_protection.js
          node scripts/test_data_quality.js
          node scripts/test_railway_inspection.js
          node scripts/test_railway_preparation.js
          node scripts/test_runbook_deployed_auth.js
          node scripts/test_runbook_consumer.js
          node scripts/test_tools_development.js
          node scripts/test_project_context_lookup.js
          node scripts/test_runbook_runtime.js
          node scripts/test_tool_service.js
          node scripts/test_sso_handshake.js --track

      - name: Test deployment source inspection
        run: |
          node scripts/test_deployment_source.js
          node scripts/test_consumer_backlog.js

      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.67.1

      - name: Prepare tool runtime and persistent storage
        if: ${{ env.DEPLOY_REQUESTED == 'true' }}
        env:
          ISOTOOLS_API_KEY: ${{ secrets.ISOTOOLS_API_KEY }}
          SESSION_SECRET: ${{ secrets.TRACK_SESSION_SECRET }}
          TOOL_API_KEY: ${{ secrets.TRACK_TOOL_API_KEY }}
          ACTIVATE_CONSUMER: ${{ inputs.activate_consumer == true }}
        run: node scripts/prepare_railway_tool.js

      - name: Verify remote configuration and central API key
        if: ${{ env.DEPLOY_REQUESTED == 'true' }}
        run: node scripts/inspect_railway_tool.js --require-deploy-config

      - name: Inspect existing service without exposing secrets
        if: ${{ env.DEPLOY_REQUESTED != 'true' }}
        run: node scripts/inspect_railway_tool.js

      - name: Select tool configuration for this upload
        if: ${{ env.DEPLOY_REQUESTED == 'true' }}
        run: cp "$RAILWAY_CONFIG_FILE" railway.toml

      - name: Deploy
        if: ${{ env.DEPLOY_REQUESTED == 'true' }}
        run: railway up --service "$RAILWAY_SERVICE" --ci

      - name: Smoke health
        if: ${{ env.DEPLOY_REQUESTED == 'true' }}
        run: node scripts/wait_tool_deployment.js

      - name: Verify deployed identity, required SSO and secret-free assets
        if: ${{ env.DEPLOY_REQUESTED == 'true' }}
        run: node scripts/inspect_railway_tool.js --require-deployed-tool

  validate_bus:
    name: Validate marked runbook events on central bus
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'validate' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install tool dependencies
        run: |
          corepack enable
          pnpm install --prod --frozen-lockfile
      - name: Verify marked QA inputs, publications, restart and correlation
        env:
          ISOTOOLS_API_KEY: ${{ secrets.ISOTOOLS_API_KEY }}
          TOOL_SELECTED: ${{ inputs.tool }}
          VERIFY_DEPLOYED_CONSUMER: 'true'
          COMPARE_TOOL_API_KEY: ${{ secrets.COMPARE_TOOL_API_KEY }}
          TRACK_TOOL_API_KEY: ${{ secrets.TRACK_TOOL_API_KEY }}
        run: node scripts/verify_runbook_bus.js

  replay_readonly:
    name: Replay existing CPA and TPP inputs without publishing
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'replay' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install tool dependencies
        run: |
          corepack enable
          pnpm install --prod --frozen-lockfile
      - name: Test read-only replay boundaries
        run: node scripts/test_readonly_replay.js
      - name: Read existing inputs and compare historical outputs
        env:
          ISOTOOLS_API_KEY: ${{ secrets.ISOTOOLS_READONLY_API_KEY || secrets.ISOTOOLS_API_KEY }}
          REPLAY_ORGANIZATION_ID: ${{ vars.ISOTOOLS_ORGANIZATION_ID || '' }}
          TOOL_SELECTED: ${{ inputs.tool }}
        run: node scripts/replay_tools_readonly.js

  isolate_logto:
    name: Isolate CPA and TPP with automatic restoration
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'isolate' && inputs.confirm_pause == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COMPARE_RAILWAY_TOKEN: ${{ secrets.RAILWAY_COMPARE_TOKEN || secrets.RAILWAY_TOKEN }}
      TRACK_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TRACK_TOKEN || secrets.RAILWAY_TOKEN }}
      COMPARE_SERVICE: ${{ vars.COMPARE_PLANNED_VS_ACTUAL_RAILWAY_SERVICE || 'compare-planned-vs-actual' }}
      TRACK_SERVICE: ${{ vars.TRACK_PROJECT_PROGRESS_RAILWAY_SERVICE || 'track-project-progress' }}
      CONFIRM_ISOLATION: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install existing dependencies and Railway CLI
        run: |
          corepack enable
          pnpm install --prod --frozen-lockfile
          npm install -g @railway/cli@5.67.1
      - name: Test restoration safety with fixtures
        run: node scripts/test_tools_isolation.js
      - name: Verify exact targets, persistent volumes and recoverable deployments
        run: node scripts/isolate_tools_logto.js plan
      - name: Preserve recovery plan before stopping anything
        uses: actions/upload-artifact@v7
        with:
          name: tool-isolation-recovery-plan
          path: .tool-isolation/plan.json
          include-hidden-files: true
      - name: Temporarily stop tools, probe once after quiet window, restore
        run: node scripts/isolate_tools_logto.js isolate
      - name: Restore any deployment still marked as stopped
        if: ${{ always() }}
        run: |
          if [ -f .tool-isolation/plan.json ]; then
            node scripts/isolate_tools_logto.js restore
          fi
      - name: Preserve sanitized isolation result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: tool-isolation-result
          path: .tool-isolation/plan.json
          include-hidden-files: true
          if-no-files-found: warn
